# Runs on every pull request and every push to main.
#
# In plain terms: GitHub rents a clean machine, installs this project on it,
# and runs the test suite, the type checker, and a production build. A red X
# means something broke. It never deploys and it has no access to secrets.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Node 22: 18 breaks on a regex this app uses, and 24 has no prebuilt
      # better-sqlite3, which makes installs slow and brittle.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Types
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
